[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_arena"
version = "0.3.0"
description = "Isaac Lab - Arena. An Isaac Lab extension for robotic policy evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "typing_extensions",
    "onnxruntime",
    "vuer[all]",
    "pytest",
    "pydantic>=2.0",
    "openai>=2.0",
    # Sensitivity analysis (isaaclab_arena.analysis.sensitivity), imported at module level.
    "sbi",
    "scipy",
    "matplotlib",
    # MoviePy 1.x relies on decorator 4.x call semantics to propagate clip FPS.
    "decorator>=4.0.2,<5",
    # HDF5 -> LeRobot conversion (isaaclab_arena_gr00t.lerobot.convert_hdf5_to_lerobot), imported at module level.
    # Pinned to 2.2.3 to match the version used in GR00T.
    "pandas==2.2.3",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "debugpy",
    "tenacity",
    "streamlit>=1.56",
    "streamlit-ace>=0.1.1",
    # Asset search for agentic environment generation. Kept here rather than behind an extra of
    # its own: it adds one wheel, since Isaac Sim already brings everything it depends on, and an
    # extra only bought a way to install the review GUI with its asset search missing.
    "simready-search>=2026.4.2",
]

# PEP 735 dependency groups for the native uv install: the sim stack the
# Docker build does not want. pip (used by the Docker build) ignores PEP 735
# groups -- so Docker keeps getting Isaac Lab and Isaac Sim from its base
# image and submodule, undisturbed by these pins.
#
[dependency-groups]
# Isaac Lab is installed editable from the publication checkout at
# submodules/IsaacLab. A bare `uv sync` selects this source group.
# Depend on the checkout's root project so its package set and extras stay the
# single source of truth. There is no fallback to a wheel from another branch.
isaaclab-from-source = [
    "isaaclab-dev[isaacsim]",
    # The source install is self-sufficient: the remote OpenPI client comes
    # along without a separate --group openpi flag.
    { include-group = "openpi" },
]
openpi = [
    # Install the standalone client wheel without cloning unrelated training
    # submodules from the full policy repository.
    "openpi-client==0.1.2",
]

[tool.uv]
# Arena supports Linux x86_64 only; resolve and lock for exactly that platform.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Install the source-based sim stack (Isaac Lab editable from the submodule)
# and the remote OpenPI client on a bare `uv sync`.
default-groups = ["isaaclab-from-source", "openpi"]
# Isaac Sim requires a transitive tinyobjloader release candidate. The exact
# constraint below makes that RC explicit without allowing unrelated packages
# to float to prereleases.
prerelease = "if-necessary-or-explicit"
# Prefer the first index containing a compatible package. The explicit PyPI
# route below handles the one known NVIDIA/PyPI name collision without merging
# candidates from multiple indexes.
index-strategy = "first-index"
# Pin numpy to the exact version Isaac Sim requires: isaacsim-kernel needs
# ==2.3.1 and numba needs <2.5. An override (not a plain dep) is needed to also
# beat a transitive constraint that would otherwise pull numpy<2.
# Pin coverage and packaging to the versions isaacsim hard-pins: the Isaac Lab
# source checkout pins coverage==7.6.1 and packaging<24, which are otherwise
# unresolvable against isaacsim.
# Pin websockets to the version the Docker environment validates:
# isaacsim-kernel's ==12.0 pin is over-strict (the Docker build runs Isaac
# Sim 6.0 with websockets 16.1.1, installed by pip alongside isaacteleop),
# and isaacteleop[cloudxr] -- needed for teleop sessions in the
# isaaclab-from-source flavor -- requires websockets>=14.
# Pin the AWS/HTTP stack to the versions Isaac Sim requires: simready-search
# asks for boto3==1.42.58, requests>=2.32.5 and s3transfer 0.16.x, all of which
# are over-strict. The Docker image runs its S3 asset searches against the
# boto3 1.40.61 / requests 2.32.3 / s3transfer 0.14.0 that isaacsim-kernel
# pins. Without these overrides simready-search cannot resolve alongside either
# sim-stack flavor at all, leaving the asset search with no installable runtime.
override-dependencies = [
    "numpy==2.3.1",
    "mujoco~=3.11.0",
    "mujoco-warp~=3.11.0",
    # Keep the source install on the same publishable Newton branch as Isaac Lab.
    "newton[sim,importers] @ git+ssh://git@gitlab.zbl.local:50022/mana/engine/newton.git@publication",
    "newton-usd-schemas @ git+ssh://git@gitlab.zbl.local:50022/mana/engine/newton.git@publication#subdirectory=extern/newton-usd-schemas",
    "coverage==7.4.4",
    "packaging==26.0",
    # Isaac Sim pins 4.12.2, while the publication Isaac Lab source requires
    # the newer typing APIs used by its viewer stack.
    "typing-extensions>=4.15.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "websockets==16.1.1",
    "boto3==1.40.61",
    "botocore==1.40.61",
    "requests==2.32.3",
    "s3transfer==0.14.0",
]

# Keep the source stack on the versions validated by Arena and Isaac Sim.
constraint-dependencies = [
    "pin-pink==3.3.0",
    "pyglet<3",
    "tinyobjloader==2.0.0rc13",
    "mujoco-usd-converter==0.2.0",
]
# Use a uv-managed CPython 3.12 rather than whatever happens to be on PATH.
python-preference = "only-managed"

[tool.uv.extra-build-dependencies]
# The schema fork uses hatchling metadata that requires packaging.licenses.
newton-usd-schemas = ["hatchling>=1.27.0", "packaging>=24.2"]

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# torch / torchvision / torchaudio are pulled transitively by Isaac Lab's
# isaacsim extra; steer them to the CUDA 12.8 index (Linux x86_64 is the only
# supported platform, see `environments` above).
# mujoco-usd-converter: the NVIDIA index carries only incompatible 0.1.0
# prereleases, so route it to PyPI.
# isaacteleop (pulled by isaaclab-teleop in the isaaclab-from-source flavor): the
# NVIDIA index carries only an incompatible 1.4 prerelease, so route it to
# PyPI, which has the required stable 1.3.x (the same version the Docker
# build installs).
mujoco-usd-converter = { index = "pypi" }
isaacteleop = { index = "pypi" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
# Isaac Lab packages come editable from the publication submodule checkout
# (one entry per source/isaaclab* package, mirroring its pyproject.toml).
isaaclab-dev = { path = "submodules/IsaacLab", editable = true }
isaaclab = { path = "submodules/IsaacLab/source/isaaclab", editable = true }
isaaclab-assets = { path = "submodules/IsaacLab/source/isaaclab_assets", editable = true }
isaaclab-contrib = { path = "submodules/IsaacLab/source/isaaclab_contrib", editable = true }
isaaclab-experimental = { path = "submodules/IsaacLab/source/isaaclab_experimental", editable = true }
isaaclab-mimic = { path = "submodules/IsaacLab/source/isaaclab_mimic", editable = true }
isaaclab-newton = { path = "submodules/IsaacLab/source/isaaclab_newton", editable = true }
isaaclab-ov = { path = "submodules/IsaacLab/source/isaaclab_ov", editable = true }
isaaclab-ovphysx = { path = "submodules/IsaacLab/source/isaaclab_ovphysx", editable = true }
isaaclab-physx = { path = "submodules/IsaacLab/source/isaaclab_physx", editable = true }
isaaclab-ppisp = { path = "submodules/IsaacLab/source/isaaclab_ppisp", editable = true }
isaaclab-rl = { path = "submodules/IsaacLab/source/isaaclab_rl", editable = true }
isaaclab-tasks = { path = "submodules/IsaacLab/source/isaaclab_tasks", editable = true }
isaaclab-tasks-experimental = { path = "submodules/IsaacLab/source/isaaclab_tasks_experimental", editable = true }
isaaclab-teleop = { path = "submodules/IsaacLab/source/isaaclab_teleop", editable = true }
isaaclab-visualizers = { path = "submodules/IsaacLab/source/isaaclab_visualizers", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "isaaclab_arena*",
    "isaaclab_arena_cosmos*",
    "isaaclab_arena_curobo*",
    "isaaclab_arena_dreamzero*",
    "isaaclab_arena_environments*",
    "isaaclab_arena_examples*",
    "isaaclab_arena_g1*",
    "isaaclab_arena_gr00t*",
    "isaaclab_arena_openpi*",
]
namespaces = false

# ----------------------------------------------------------------------------
# Existing tool configuration (migrated unchanged from the previous pyproject)
# ----------------------------------------------------------------------------

[tool.isort]

py_version = 312
line_length = 120
group_by_package = true

# Files to skip
skip_glob = ["docs/*", "logs/*", "_isaac_sim/*", ".vscode/*"]

# Order of imports
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

# Extra standard libraries considered as part of python (permissive licenses
extra_standard_library = [
    "numpy",
    "h5py",
    "open3d",
    "torch",
    "tensordict",
    "bpy",
    "matplotlib",
    "gymnasium",
    "gym",
    "scipy",
    "hid",
    "yaml",
    "prettytable",
    "toml",
    "trimesh",
    "tqdm",
    "torchvision",
    "transformers",
]
# Imports from Isaac Sim and Omniverse
known_third_party = [
    "isaacsim.replicator.common",
    "omni.replicator.core",
    "pxr",
    "omni.kit.*",
    "warp",
    "carb",
    "Semantics",
    "isaaclab",
    "isaaclab_assets",
    "isaaclab_rl",
    "isaaclab_mimic",
    "isaaclab_tasks",
]
# Imports from this repository
known_first_party = "isaaclab_arena"

[tool.pyright]

include = ["source", "scripts"]
exclude = [
    "**/__pycache__",
    "**/_isaac_sim",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]

typeCheckingMode = "basic"
pythonVersion = "3.10"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

# This is required as the CI pre-commit does not download the module (i.e. numpy, torch, prettytable)
# Therefore, we have to ignore missing imports
reportMissingImports = "none"
# This is required to ignore for type checks of modules with stubs missing.
reportMissingModuleSource = "none" # -> most common: prettytable in mdp managers

reportGeneralTypeIssues = "none"       # -> raises 218 errors (usage of literal MISSING in dataclasses)
reportOptionalMemberAccess = "warning" # -> raises 8 errors
reportPrivateUsage = "warning"


[tool.codespell]
skip = '*.usd,*.svg,*.png,_isaac_sim*,*.bib,*.css,*/_build'
quiet-level = 0
# the world list should always have words in lower case
ignore-words-list = "haa,slq,collapsable,buss,crate,reacher"
